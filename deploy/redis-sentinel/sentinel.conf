# Configuración común de los tres Sentinels (desarrollo local).
# El puerto de cada instancia se pasa por flag (--port) al arrancar, y al correr
# con network_mode: host cada Sentinel anuncia su puerto real automáticamente.
#
# announce-ip 127.0.0.1 hace que las direcciones que Sentinel reporta a los
# clientes sean alcanzables desde el host (ver nota en docker-compose.yml).
sentinel announce-ip 127.0.0.1
sentinel resolve-hostnames yes

# Monitoriza el master (alias "master") en 127.0.0.1:6379; quórum = 2.
sentinel monitor master 127.0.0.1 6379 2
sentinel down-after-milliseconds master 5000
sentinel failover-timeout master 10000
sentinel parallel-syncs master 1
