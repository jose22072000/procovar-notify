name: CI (v2)

# Solo feature/**: este workflow es el chequeo de desarrollo (lint/test/build/
# smoke), no de producción. main y staging NO lo disparan — main solo dispara
# los workflows de publicación de imagen (backend.yml/services.yml/frontend.yml);
# staging lo despliega Dokploy directo desde el repo. Ver "Flujo de branches"
# en CLAUDE.md.
on:
  push:
    branches: ["feature/**"]

jobs:
  lint-test-build:
    name: Backend — lint, test y build (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      # Se instala con `go install` para compilarlo con la MISMA Go del proyecto
      # (go.mod usa una versión muy reciente y los binarios prebuilt del action la
      # rechazan; además así se respeta el config v1 de .golangci.yml).
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run --timeout=5m

      - name: Tests (con cobertura)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Resumen de cobertura
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: |
          go build -o ../bin/api ./cmd/api
          go build -o ../bin/worker ./cmd/worker

  frontend:
    name: Frontend — test, typecheck y build (SPA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (con cobertura y umbral)
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

  smoke:
    name: Smoke test (/readyz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Smoke test (infra + API + /readyz)
        run: ./deploy/smoke.sh
